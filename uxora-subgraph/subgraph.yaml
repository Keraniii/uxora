specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: UxoraRegistry
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000a07e1f"
      abi: UxoraRegistry
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - WireframeCreated
        - WireframeUpdated
      abis:
        - name: UxoraRegistry
          file: ./abis/UxoraRegistry.json
      eventHandlers:
        - event: WireframeCreated(indexed string,string,string,indexed address,uint256)
          handler: handleWireframeCreated
        - event: WireframeUpdated(indexed string,string,uint256)
          handler: handleWireframeUpdated
      file: ./src/uxora-registry.ts
